<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Matrículas - Guardião Pantaneiro</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>

    <!-- SIDEBAR COMPARTILHADO (Aba Ativa: Matrículas) -->
    <div th:replace="~{fragments/sidebar :: sidebar('matriculas')}"></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">

        <!-- MENSAGENS DE ALERTA DO CONTROLLER -->
        <div th:if="${mensagemSucesso}"
            style="background-color: #22C55E; color: #FFFFFF; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px;">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${mensagemSucesso}"></span>
        </div>

        <div th:if="${mensagemErro}"
            style="background-color: #EF4444; color: #FFFFFF; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px;">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${mensagemErro}"></span>
        </div>

        <!-- CABEÇALHO DA PÁGINA -->
        <header class="page-header">
            <div class="header-title">
                <h1>Matrículas</h1>
                <p>Situação de cada aluno — turma, data e status</p>
            </div>
            <button type="button" class="btn-warning" onclick="abrirModalMatricula()">
                <i class="bi bi-plus-lg"></i> NOVA MATRÍCULA
            </button>
        </header>

        <!-- BARRA DE BUSCA E FILTROS DE STATUS -->
        <div style="display: flex; gap: 16px; margin-bottom: 24px; align-items: center;">
            <div class="search-container" style="flex: 1; max-width: 360px;">
                <i class="bi bi-search"></i>
                <input type="text" id="inputBusca" class="search-input" placeholder="Buscar por nome..."
                    onkeyup="filtrarMatriculas()">
            </div>

            <!-- Botões de Filtro -->
            <div class="filter-group"
                style="display: flex; gap: 4px; background-color: var(--bg-card, #1E293B); padding: 4px; border-radius: 8px; border: 1px solid var(--border-color, #334155);">
                <button type="button" class="btn-filter active" onclick="filtrarStatus('TODOS', this)">TODOS</button>
                <button type="button" class="btn-filter" onclick="filtrarStatus('Ativa', this)">ATIVAS</button>
                <button type="button" class="btn-filter" onclick="filtrarStatus('Inativa', this)">INATIVAS</button>
            </div>
        </div>

        <!-- TABELA DE MATRÍCULAS -->
        <section class="table-card">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th style="width: 25%;">ALUNO</th>
                        <th style="width: 10%;">IDADE</th>
                        <th style="width: 12%;">FAIXA</th>
                        <th style="width: 20%;">TURMA</th>
                        <th style="width: 15%;">DATA MATRÍCULA</th>
                        <th style="width: 10%;">STATUS</th>
                        <th style="width: 8%; text-align: right;">AÇÕES</th>
                    </tr>
                </thead>
                <tbody id="tabelaMatriculas">
                    <tr th:if="${#lists.isEmpty(matriculas)}">
                        <td colspan="7" style="text-align: center; color: #94A3B8; padding: 32px;">
                            Nenhuma matrícula encontrada.
                        </td>
                    </tr>

                    <tr th:each="mat : ${matriculas}" th:data-status="${mat.status}">
                        <!-- NOME DO ALUNO -->
                        <td style="font-weight: 700; color: #F8FAFC;" th:text="${mat.aluno.nome}">
                            Marcos Oliveira da Silva
                        </td>

                        <!-- IDADE -->
                        <td style="color: #94A3B8;" th:text="${alunoService.calcularIdade(mat.aluno)} + ' anos'">
                            12 anos
                        </td>

                        <!-- FAIXA ATUAL -->
                        <td>
                            <span class="badge-faixa"
                                th:classappend="'badge-' + ${#strings.toLowerCase(mat.aluno.graduacao)}"
                                th:text="${mat.aluno.graduacao}">Amarela</span>
                        </td>

                        <!-- TURMA -->
                        <td style="color: #F8FAFC;" th:text="${mat.turma.nome}">
                            Turma 1
                        </td>

                        <!-- DATA DA MATRÍCULA -->
                        <td style="color: #94A3B8;" th:text="${#temporals.format(mat.dataMatricula, 'dd/MM/yyyy')}">
                            13/08/2026
                        </td>

                        <!-- STATUS (Com Badge Verde / Vermelha) -->
                        <td>
                            <span th:if="${mat.status == 'Ativa' or mat.status == null}" class="status-badge-ativa">
                                <i class="bi bi-check-circle-fill"></i> Ativa
                            </span>
                            <span th:if="${mat.status == 'Inativa'}" class="status-badge-inativa">
                                <i class="bi bi-x-circle-fill"></i> Inativa
                            </span>
                        </td>

                        <!-- BOTÃO DE AÇÃO -->
                        <td style="text-align: right;">
                            <a th:href="@{/matriculas/alterar-status/{id}(id=${mat.idMatricula})}" class="btn-secondary"
                                style="font-size: 12px; padding: 5px 12px; text-decoration: none;"
                                th:text="${mat.status == 'Ativa' or mat.status == null ? 'Inativar' : 'Ativar'}">
                                Inativar
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

    <!-- MODAL REGISTRO DE NOVA MATRÍCULA -->
    <div class="modal-overlay" id="modalMatricula">
        <div class="modal-card" style="max-width: 440px;">
            <div class="modal-header">
                <div>
                    <h2>Nova Matrícula</h2>
                    <p>Vincular aluno a uma turma</p>
                </div>
                <button type="button" class="btn-close-modal" onclick="fecharModalMatricula()">&times;</button>
            </div>

            <form th:action="@{/matriculas/salvar}" th:object="${matriculaForm}" method="POST" id="formMatricula">
                <input type="hidden" th:field="*{idMatricula}">

                <div class="modal-body">

                    <!-- MENSAGEM DE ERRO DENTRO DO MODAL -->
                    <div th:if="${mensagemErroModal}"
                        style="background-color: #EF4444; color: #FFFFFF; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-weight: 600; font-size: 13px;">
                        <i class="bi bi-exclamation-triangle-fill" style="margin-right: 8px;"></i>
                        <span th:text="${mensagemErroModal}"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label">ALUNO</label>
                        <select class="form-select" th:field="*{aluno.idPessoa}" required>
                            <option value="">Selecione o aluno...</option>
                            <option th:each="a : ${alunos}" th:value="${a.idPessoa}" th:text="${a.nome}">Marcos Oliveira
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">TURMA</label>
                        <select class="form-select" th:field="*{turma.idTurma}" required>
                            <option value="">Selecione a turma...</option>
                            <option th:each="t : ${turmas}" th:value="${t.idTurma}"
                                th:text="${t.nome} + ' (' + ${t.diasSemana} + ')'">Infantil Iniciante</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">DATA DE MATRÍCULA</label>
                        <input type="date" class="form-input" th:field="*{dataMatricula}" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">STATUS</label>
                        <select class="form-select" th:field="*{status}">
                            <option value="Ativa">Ativa</option>
                            <option value="Inativa">Inativa</option>
                        </select>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="fecharModalMatricula()">Cancelar</button>
                    <button type="submit" class="btn-warning">SALVAR</button>
                </div>
            </form>
        </div>
    </div>

    <!-- CARREGAR O ARQUIVO EXTERNO JS -->
    <script th:src="@{/js/matricula.js}"></script>

    <!-- BLOCO THYMELEAF (MANTIDO APENAS PARA VARIÁVEIS DE SERVIDOR) -->
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            /*[# th:if="${abrirModalErro}"]*/
            const modal = document.getElementById('modalMatricula');
            if (modal) modal.classList.add('active');
            /*[/]*/
        });
    </script>

</body>

</html>
