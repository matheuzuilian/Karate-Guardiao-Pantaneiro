version: '3.8'

services:
  app:
    build: .
    container_name: app-guardiao-pantaneiro
    ports:
      - "8182:8182"
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    # Como o seu MySQL já está rodando num container separado fora deste compose,
    # usamos a rede padrão do docker ou conectamos à mesma rede.
    extra_hosts:
      - "host.docker.internal:host-gateway"